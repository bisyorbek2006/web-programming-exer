<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block vs Inline</title>
</head>
<body>
  <h2>Heading (block)</h2>
  <p>Paragraph (block)</p>
  <div>Div (block)</div>

  <p>
    This paragraph contains <strong>bold</strong>, <em>italic</em>,
    <a href="#">a link</a>, and <span style="color: teal;">coloured text</span>.
  </p>
</body>
</html>
