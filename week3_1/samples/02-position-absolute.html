<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position: absolute</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .card {
      position: relative; width: 280px; height: 160px; background: #f0fdfa;
      border: 2px solid #14b8a6; border-radius: 10px; margin: 40px;
    }
    .badge {
      position: absolute; top: -12px; right: -12px; background: #0f766e;
      color: #fff; font-size: 12px; font-weight: bold; padding: 4px 10px;
      border-radius: 20px;
    }
    .card-title { padding: 20px; font-size: 18px; font-weight: bold; color: #0f766e; }
  </style>
</head>
<body>
  <h1>position: absolute</h1>
  <p><a href="../index.html">Back to Week 3</a></p>
  <div class="card">
    <span class="badge">NEW</span>
    <div class="card-title">CSS Advanced Guide</div>
  </div>
</body>
</html>
