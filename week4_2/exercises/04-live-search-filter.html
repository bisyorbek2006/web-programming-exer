<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Search Filter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 420px; margin: 0 auto; }
    h2 { color: #1a56db; }
    #search { width: 100%; padding: 10px 14px; font-size: 16px; border: 2px solid #1a56db; border-radius: 10px; margin-bottom: 14px; }
    .student { padding: 10px 14px; margin-bottom: 6px; background: #f0f4ff; border-radius: 8px; border: 1px solid #c8d4f0; }
    mark { background: #f7df1e; border-radius: 3px; }
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>
</head>
<body>
  <h1>Live Search Filter</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <h2>Student Search</h2>
  <input id="search" type="text" placeholder="Search students...">
  <div id="student-list">
    <div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div>
    <div class="student" data-name="Park Minjun">Park Minjun — Computer Science</div>
    <div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div>
    <div class="student" data-name="Choi Hyunwoo">Choi Hyunwoo — Artificial Intelligence</div>
    <div class="student" data-name="Jung Yuna">Jung Yuna — Data Science</div>
    <div class="student" data-name="Kang Seojun">Kang Seojun — Web Programming</div>
  </div>
  <p id="no-results">No students found.</p>
  <script>
    const search = document.getElementById('search');
    const students = [...document.querySelectorAll('.student')];
    const noResults = document.getElementById('no-results');
    search.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      let visible = 0;
      students.forEach(student => {
        const name = student.dataset.name.toLowerCase();
        const matches = name.includes(term);
        student.style.display = matches ? '' : 'none';
        if (matches) visible++;
      });
      noResults.style.display = visible ? 'none' : 'block';
    });
  </script>
</body>
</html>
