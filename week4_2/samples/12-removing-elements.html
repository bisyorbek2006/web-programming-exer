<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Removing Elements</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    a { color: #0b57d0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .box { background: #f3f6f1; border: 1px solid #d7e1da; padding: 1rem; margin-top: 1rem; border-radius: 10px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x:auto; }
  </style>
</head>
<body>
  <h1>Removing Elements</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <div class="box">
    <p>This sample demonstrates the JavaScript DOM concept for removing elements.</p>
    <ul id="rem-list"><li>Item One</li><li>Item Two</li><li>Item Three</li></ul>
<script>
  document.getElementById('rem-list').addEventListener('click', (e) => {
    if (e.target.tagName === 'LI') e.target.remove();
  });
</script>
  </div>
</body>
</html>
