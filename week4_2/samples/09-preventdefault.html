<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e.preventDefault()</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    a { color: #0b57d0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .box { background: #f3f6f1; border: 1px solid #d7e1da; padding: 1rem; margin-top: 1rem; border-radius: 10px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x:auto; }
  </style>
</head>
<body>
  <h1>e.preventDefault()</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <div class="box">
    <p>This sample demonstrates the JavaScript DOM concept for e.preventdefault().</p>
    <form id="demo-form" style="display:flex; gap:8px; max-width:360px; margin-top:12px;">
  <input type="text" placeholder="Type something" style="padding:8px; flex:1;">
  <button type="submit" style="padding:8px 12px; background:#0f766e; color:white; border:none; border-radius:8px;">Send</button>
</form>
<script>
  document.getElementById('demo-form').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Form submitted with preventDefault()');
  });
</script>
  </div>
</body>
</html>
