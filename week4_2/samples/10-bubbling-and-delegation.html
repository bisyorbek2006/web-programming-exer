<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Bubbling & Delegation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    a { color: #0b57d0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .box { background: #f3f6f1; border: 1px solid #d7e1da; padding: 1rem; margin-top: 1rem; border-radius: 10px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x:auto; }
  </style>
</head>
<body>
  <h1>Event Bubbling & Delegation</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <div class="box">
    <p>This sample demonstrates the JavaScript DOM concept for event bubbling & delegation.</p>
    <div id="container" style="padding:12px; border:1px solid #0f766e; border-radius:10px; background:#f0fdfa;">
  <button id="bubble-btn">Click me</button>
  <p id="bubble-log">No click yet.</p>
</div>
<script>
  const container = document.getElementById('container');
  container.addEventListener('click', (e) => {
    document.getElementById('bubble-log').textContent = 'Bubbled from: ' + e.target.id;
  });
</script>
  </div>
</body>
</html>
