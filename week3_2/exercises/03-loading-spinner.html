<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Spinner</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 200px; background: #f0fdfa; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spinner {
      width: 50px; height: 50px; border-radius: 50%; border: 4px solid #ccfbf1; border-top-color: #0f766e; animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <h1 style="display:none">Loading Spinner</h1>
  <div class="spinner"></div>
</body>
</html>
