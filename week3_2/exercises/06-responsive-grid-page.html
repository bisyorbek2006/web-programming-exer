<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Responsive Grid Page</title>
  <style>
    :root { --primary: #0f766e; --accent: #14b8a6; --bg: #f0fdfa; --text: #1e293b; --radius: 12px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { border: 2px solid #e2e8f0; border-radius: var(--radius); padding: 18px; transition: transform 0.25s ease, box-shadow 0.25s ease; background: white; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(15,118,110,0.15); }
    .card[data-icon]::before { content: attr(data-icon) ' '; font-size: 2rem; display: block; }
    @media (prefers-color-scheme: dark) { :root { --bg:#051a0a; --text:#d4edda; } body { background: var(--bg); color: var(--text); } .card { background: #0b2017; } }
  </style>
</head>
<body>
  <h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</body>
</html>
