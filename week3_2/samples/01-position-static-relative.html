<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position: static & relative</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .box {
      width: 140px; height: 60px; background: #0f766e; color: #fff;
      padding: 8px; margin: 8px; font-size: 13px; display: flex;
      align-items: center; justify-content: center; text-align: center;
    }
    .static { position: static; }
    .relative {
      position: relative; top: 20px; left: 30px; background: #14b8a6;
    }
  </style>
</head>
<body>
  <h1>position: static & relative</h1>
  <p><a href="../index.html">Back to Week 3</a></p>
  <div class="box static">static (default)</div>
  <div class="box relative">relative — shifted ↓20px →30px</div>
  <div class="box static">Next element — unaffected by relative shift</div>
</body>
</html>
