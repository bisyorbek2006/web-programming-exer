<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline Elements</title>
  <style>
    .highlight { background: yellow; color: black; padding: 2px 4px; }
  </style>
</head>
<body>
  <p>Normal text, <strong>bold text</strong>, <em>italic text</em>, <a href="#">a link</a>, and <span class="highlight">highlighted text</span> all flow together.</p>
</body>
</html>
