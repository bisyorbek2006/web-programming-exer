<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paragraphs</title>
</head>
<body>
  <p>This is the first paragraph. Extra spaces and line breaks are collapsed.</p>
  <p>This is the second paragraph. The browser adds spacing automatically.</p>

</body>
</html>
