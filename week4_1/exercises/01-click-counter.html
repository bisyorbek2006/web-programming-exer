<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Counter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .done { background: #16a34a !important; }
    button { padding: 14px 30px; font-size: 18px; border: none; border-radius: 10px; background: #1a56db; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Click Counter with Color Change</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <button id="clicker">Click me!</button>
  <p id="count" style="font-size:32px;font-weight:bold;margin:16px 0">0</p>
  <p id="message" style="font-size:16px;color:#666">Keep clicking...</p>
  <script>
    const button = document.getElementById('clicker');
    const countEl = document.getElementById('count');
    const messageEl = document.getElementById('message');
    let count = 0;
    button.addEventListener('click', () => {
      count++;
      countEl.textContent = count;
      if (count >= 5) {
        button.classList.add('done');
        messageEl.textContent = 'Congratulations! You hit 5 clicks.';
      }
    });
  </script>
</body>
</html>
