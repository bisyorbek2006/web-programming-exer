<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Toggle Card</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; }
    .card { padding: 24px; border-radius: 16px; width: 260px; background: #f0f4ff; border: 2px solid #c8d4f0; text-align: center; transition: all 0.3s; }
    .card.dark { background: #1a2340; border-color: #3a4a70; color: white; }
    .avatar { width: 70px; height: 70px; border-radius: 50%; background: #1a56db; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 12px; }
    button { padding: 8px 20px; border-radius: 20px; cursor: pointer; border: none; margin-top: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <h1 style="display:none">Dark Mode Toggle Card</h1>
  <div id="card" class="card">
    <div class="avatar">👩‍💻</div>
    <h2>Kim Jisoo</h2>
    <p>Web Programming Student</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>
  <script>
    const card = document.getElementById('card');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
      card.classList.toggle('dark');
      toggleBtn.textContent = card.classList.contains('dark') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });
  </script>
</body>
</html>
