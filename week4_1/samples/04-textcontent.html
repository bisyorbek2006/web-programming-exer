<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>textContent — Reading & Writing Text</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    a { color: #0b57d0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .box { background: #f3f6f1; border: 1px solid #d7e1da; padding: 1rem; margin-top: 1rem; border-radius: 10px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x:auto; }
  </style>
</head>
<body>
  <h1>textContent — Reading & Writing Text</h1>
  <p><a href="../index.html">Back to Week 4</a></p>
  <div class="box">
    <p>This sample demonstrates the JavaScript DOM concept for textcontent — reading & writing text.</p>
    <div style="padding:16px;border:1px solid #cbd5e1;border-radius:12px; max-width:420px;">
  <h3 id="msg">Original Text</h3>
  <input id="inp" type="text" placeholder="Type new text..." style="padding:8px;width:200px; margin-right:8px;">
  <button onclick="document.getElementById('msg').textContent = document.getElementById('inp').value || 'Original Text';">Change Text</button>
</div>
  </div>
</body>
</html>
