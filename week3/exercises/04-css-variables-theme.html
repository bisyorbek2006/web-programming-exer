<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables Theme</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #1e293b;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #051a0a; --text: #d4edda; }
    }
    body { background: var(--bg); color: var(--text); font-family: Arial, sans-serif; padding: 20px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: var(--radius); }
    .card { background: white; border: 2px solid var(--accent); border-radius: var(--radius); padding: 20px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>CSS Variables Theme</h1>
  <p><a href="../index.html">Back to Week 3</a></p>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
